name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and build the web app
        run: |
          npm install
          npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # camera access for "Take a photo of your meal"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $MANIFEST
          grep -q CAMERA $MANIFEST
          # every build gets a higher version so it installs as an update
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Use the repo's signing key so updates install over the old app
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PersonalFitness.apk

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Personal Fitness by Abhisek 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            Download **PersonalFitness.apk** below on your Android phone and open it to install.
            If Android asks, allow installs from your browser or file manager.
          files: PersonalFitness.apk
